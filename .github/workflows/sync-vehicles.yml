name: Sync vehicles from Gorilla Motors

on:
  schedule:
    - cron: '0 21 * * *'  # 06:00 KST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh inventory
        run: python3 scripts/sync_vehicles.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vehicles.json
          git diff --cached --quiet || (git commit -m "chore: refresh vehicle inventory" && git push)
