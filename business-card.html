    <main class="flex-grow flex flex-col items-center justify-center relative pt-16 md:pt-0">

    <!-- Three.js + QR Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Custom 3D Script -->
    <script src="js/business-card.js"></script>

    <script>
        // Mobile Menu Toggle
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            const line1 = document.getElementById('menuLine1');
            const line2 = document.getElementById('menuLine2');
            const line3 = document.getElementById('menuLine3');
            
            menu.classList.toggle('active');
            
            if (menu.classList.contains('active')) {
                line1.style.transform = 'rotate(45deg) translate(5px, 5px)';
                line2.style.opacity = '0';
                line3.style.transform = 'rotate(-45deg) translate(5px, -5px)';
            } else {
                line1.style.transform = '';
                line2.style.opacity = '1';
                line3.style.transform = '';
            }
        }
        
        // Optimized Custom Cursor - Desktop only
        if (window.matchMedia('(min-width: 1024px) and (pointer: fine)').matches) {
            const cursorDot = document.querySelector('.cursor-dot');
            const cursorOutline = document.querySelector('.cursor-outline');
            
            let mouseX = 0, mouseY = 0;
            let outlineX = 0, outlineY = 0;
            
            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                cursorDot.style.transform = 'translate3d(' + mouseX + 'px,' + mouseY + 'px,0) translate(-50%, -50%)';
            }, { passive: true });
            
            function animateCursor() {
                outlineX += (mouseX - outlineX) * 0.15;
                outlineY += (mouseY - outlineY) * 0.15;
                cursorOutline.style.transform = 'translate3d(' + outlineX + 'px,' + outlineY + 'px,0) translate(-50%, -50%)';
                requestAnimationFrame(animateCursor);
            }
            animateCursor();
        }
    </script>
</body>
